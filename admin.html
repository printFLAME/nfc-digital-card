<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">

      <style>
/*=============== YOUR EXACT CSS (100% UNTOUCHED) ===============*/
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Syne:wght@400..800&display=swap");
:root { --header-height: 3.5rem; --hue: 110; --first-color: hsl(var(--hue), 75%, 60%); --white-color: hsl(var(--hue), 24%, 98%); --black-color: hsl(var(--hue), 12%, 8%); --text-color: hsl(var(--hue), 4%, 70%); --body-color: hsl(var(--hue), 12%, 4%); --container-color: hsl(var(--hue), 8%, 10%); --body-font: "Poppins", sans-serif; --small-font-size: .813rem; }
* { box-sizing: border-box; padding: 0; margin: 0; }
body { background-color: var(--body-color); color: var(--text-color); font-family: var(--body-font); display: flex; justify-content: center; align-items: flex-start; padding: 2rem 1rem; }
input, button, textarea, select { border: none; outline: none; background: none; }
.button { display: inline-flex; align-items: center; justify-content: center; column-gap: .5rem; background-color: var(--first-color); color: var(--black-color); padding: 1rem 2rem; border-radius: 4rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
.button:hover { box-shadow: 0 8px 24px hsla(var(--hue), 75%, 60%, 0.3); }

.edit-modal-content { background: var(--container-color); padding: 2rem; border-radius: 1rem; width: 100%; max-width: 550px; border: 1px solid var(--first-color); margin: 2rem auto; }
.edit-modal-content h2 { border-bottom: 1px solid var(--first-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem; color: var(--white-color); }
.edit-modal-content h3 { margin-top: 2rem; padding-bottom: 0.4rem; border-bottom: 1px solid #333; color: var(--white-color); font-size: 1.05rem; }
.edit-modal-content label { display: block; margin-top: 1.2rem; margin-bottom: 0.5rem; color: var(--first-color); font-size: var(--small-font-size); text-transform: uppercase; letter-spacing: 1px; }
.edit-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #333; color: var(--white-color); padding: 12px; border-radius: 6px; font-family: var(--body-font); margin-bottom: 0.5rem; }
.edit-input:focus { border-color: var(--first-color); }
.edit-input option { background: #141414; color: var(--white-color); }
.edit-textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #333; color: var(--white-color); padding: 12px; border-radius: 6px; font-family: var(--body-font); margin-bottom: 0.8rem; resize: vertical; min-height: 80px; }
.edit-textarea:focus { border-color: var(--first-color); }
.dynamic-row { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 1.2rem 1rem 1rem; border-radius: 6px; margin-bottom: 1rem; position: relative; }
.custom-card-box { background: rgba(0,0,0,0.35); border: 1px solid #2a2a2a; padding: 1rem; border-radius: 6px; margin-top: 0.75rem; position: relative; }
.nested-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.nested-row .edit-input { margin-bottom: 0; }
.remove-btn { position: absolute; top: 0.5rem; right: 0.5rem; color: var(--first-color); font-size: 1.2rem; cursor: pointer; }
.nested-remove-btn { color: var(--first-color); font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
.add-btn { background: transparent; border: 1px dashed var(--first-color); color: var(--first-color); padding: 0.8rem; width: 100%; text-transform: uppercase; cursor: pointer; font-weight: bold; margin-top: 0.5rem; transition: 0.3s; border-radius: 6px;}
.add-btn:hover { background: hsla(var(--hue), 75%, 60%, 0.1); }
.sub-add-btn { background: transparent; border: 1px dashed #555; color: var(--white-color); padding: 0.5rem; width: 100%; font-size: 0.78rem; text-transform: uppercase; cursor: pointer; margin-top: 0.4rem; border-radius: 6px; }
.sub-add-btn:hover { border-color: var(--first-color); color: var(--first-color); }
.edit-actions { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }

/* Theme Color Swatches */
.theme-swatches { display: flex; gap: 0.85rem; flex-wrap: wrap; margin-top: 0.5rem; margin-bottom: 0.5rem; }
.theme-circle { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
.theme-circle:hover { transform: scale(1.12); }
.theme-circle.active { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 12px rgba(255,255,255,0.6); }

#loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--body-color); display: flex; justify-content: center; align-items: center; z-index: 9999; }
.spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--first-color); animation: spin 1s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
      </style>

   <body>

         <!--==================== HERO SECTION ====================-->

         <!--==================== WORK / PROJECTS SECTION ====================-->

         <div id="edit-projects-container"></div>
         <button type="button" class="add-btn" id="add-project-btn">+ Add Project</button>

         <!--==================== SERVICES SECTION ====================-->
         <h3>Services Section (Max 6)</h3>
         <div id="edit-services-container"></div>
         <button type="button" class="add-btn" id="add-service-btn">+ Add Service</button>

         <h3>Skills Section (Max 5 Category Cards)</h3>

         <h3>Custom Sections (Optional - Max 3)</h3>

         <button type="button" class="add-btn" id="add-custom-section-btn">+ Add Custom Section</button>

         <!--==================== CONNECT WITH ME SECTION ====================-->
         <h3>Connect With Me</h3>
         <label>Mobile Number (Compulsory - Copies on Click)</label>
         <input type="text" id="edit-phone" class="edit-input" placeholder="+91 00000 00000" required>

         <label>Redirect Buttons (Instagram, LinkedIn, etc.)</label>
         <div id="edit-links-container"></div>
         <button type="button" class="add-btn" id="add-link-btn">+ Add Redirect Button</button>
         
         <div class="edit-actions">
            <button class="button" id="edit-logout-btn" style="background: transparent; border: 1px solid var(--first-color); color: var(--first-color); padding: 0.8rem 1.5rem; margin-right: auto;">Sign Out</button>
            <button class="button" id="edit-close-btn" style="background: transparent; border: 1px solid var(--text-color); color: var(--white-color); padding: 0.8rem 1.5rem;">Cancel</button>
            <button class="button" id="edit-save-btn" style="padding: 0.8rem 1.5rem;">Save Live</button>
         </div>
      </div>

      <script type="module">
         import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
         import { initializeAuth, browserSessionPersistence, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
         import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

         const firebaseConfig = {
           apiKey: "AIzaSyA043mcgewwke4Rt2HusOPbcxgmzUv2bM0",
           authDomain: "nfc-card-by-flame.firebaseapp.com",
           projectId: "nfc-card-by-flame",
           storageBucket: "nfc-card-by-flame.firebasestorage.app",
           messagingSenderId: "185781519047",
           appId: "1:185781519047:web:dcf141d9669a3055e274e2"
         };

         const app = initializeApp(firebaseConfig);

         // NO GHOST SESSIONS: login lives in sessionStorage only (this tab, gone when the tab closes).
         const auth = initializeAuth(app, { persistence: browserSessionPersistence });
         const db = getFirestore(app);

         // The card ID comes from the URL and ONLY from the URL (the old sessionStorage fallback is gone).
         try { sessionStorage.removeItem('savedUserSlug'); localStorage.removeItem('savedUserSlug'); } catch (_) {}

         /* ---------------- helpers ---------------- */
         const $ = (id) => document.getElementById(id);
         const withTimeout = (promise, ms = 15000) =>
           Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);

         // Only http(s)/mailto/tel links are accepted (blocks javascript: URLs). Bare domains get https://
         function normalizeUrl(raw, protocols = ['http:', 'https:', 'mailto:', 'tel:']) {
           const value = String(raw ?? '').trim();
           if (!value) return '';
           const candidate = /^(https?:\/\/|mailto:|tel:)/i.test(value) ? value : 'https://' + value;
           try {
             const url = new URL(candidate);
             return protocols.includes(url.protocol) ? url.href : '';
           } catch (_) { return ''; }
         }

         function safeImageSrc(src) {
           const value = String(src ?? '').trim();
           if (/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(value)) return value;
           return normalizeUrl(value, ['http:', 'https:']);
         }

         function compressImageFile(file, maxWidth, callback) {
           const reader = new FileReader();
           reader.onload = function(event) {
             const img = new Image();
             img.onload = function() {
               const canvas = document.createElement('canvas');
               
               // Automatically upgrades 400px/500px limits to 1200px HD
               const targetMax = Math.max(maxWidth || 1200, 1200);
               let width = img.width;
               let height = img.height;

               // Only shrink if the uploaded photo is wider than 1200px (prevents stretching smaller images)
               if (width > targetMax) {
                 height = Math.round(height * (targetMax / width));
                 width = targetMax;
               }

               canvas.width = width;
               canvas.height = height;

               const ctx = canvas.getContext('2d');
               
               // Enable high-quality smoothing so edges and text stay sharp
               ctx.imageSmoothingEnabled = true;
               ctx.imageSmoothingQuality = 'high';
               
               ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

               // Export as sharp WebP (smaller file size for Firebase), with automatic fallback to 92% JPEG
               let dataUrl = canvas.toDataURL('image/webp', 0.92);
               if (!dataUrl.startsWith('data:image/webp')) {
                 dataUrl = canvas.toDataURL('image/jpeg', 0.92);
               }
               callback(dataUrl);
             };
             img.onerror = () => alert("That file couldn't be read as an image. Please choose another photo.");
             img.src = event.target.result;
           };
           reader.readAsDataURL(file);
         }

         const userSlug = (new URLSearchParams(window.location.search).get('user') || '').trim();
         const slugIsValid = /^[A-Za-z0-9._-]{1,64}$/.test(userSlug) && userSlug !== '.' && userSlug !== '..';
         const slugParam = encodeURIComponent(userSlug);

         const loader = $('loader');

         // Leaving this page ALWAYS goes to the public profile (never to claim.html), and uses replace()
         // so the Back button can't loop between pages.
         const goToProfile = () => window.location.replace(`index.html?user=${slugParam}`);

         // Errors are shown INSIDE the loader overlay, so a failure can never leave a silent black screen.
         function showLoadError() {
           loader.innerHTML = `
             <div style="text-align:center; padding:2rem; color:#fff;">
               <h2 style="margin-bottom:1rem;">Couldn't load your settings</h2>
               <p style="color:#888; margin-bottom:1.5rem;">Check your connection and try again.</p>
               <button class="button" id="retry-btn">Try again</button>
               <button class="button" id="back-btn" style="background: transparent; border: 1px solid var(--text-color); color: var(--white-color); margin-left: .5rem;">Back</button>
             </div>`;
           loader.style.display = 'flex';
           $('retry-btn').addEventListener('click', () => window.location.reload());
           $('back-btn').addEventListener('click', goToProfile);
         }

         /* ---------------- DEFAULT CONTENT ---------------- */
         const DEFAULTS = {
           themeHue: 110,
           heroName: "Name Here",
           heroRoles: ["Role 1", "Role 2", "Role 3"],
           heroTag: "Add your tagline here.",
           aboutTitle: "About me section",
           projects: [
             {
               projectTitle: "Restaurant Website",
               projectDescription: "Professional website using HTML, CSS, and JavaScript.",
               projectImageUrl: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80",
               projectLink: "https://example.com"
             }
           ],
           services: [
             {
               serviceName: "Website Developer",
               serviceDescription: "The service I offer to companies and clients involves working on professional, high-quality projects, doing what I am most passionate about.",
               servicePerks: ["Web development", "Web performance", "Database", "Basic SEO"]
             },
             {
               serviceName: "Web Designer",
               serviceDescription: "The service I offer to companies and clients involves working on professional, high-quality projects, doing what I am most passionate about.",
               servicePerks: ["Designer", "Responsive design", "Basic SEO"]
             }
           ],
           skillCategories: [
             {
               categoryTitle: "Frontend",
               skills: ["HTML", "CSS", "JavaScript", "React", "Sass", "Git", "GitHub"]
             },
             {
               categoryTitle: "Backend",
               skills: ["Laravel", "PostgreSQL", "Node Js", "Supabase", "Socket.io"]
             },
             {
               categoryTitle: "Design",
               skills: ["Figma", "Blender", "After effects", "Photoshop", "Ilustrator", "Framer"]
             }
           ],
           phoneNumber: "+91 00000 00000",
           links: [
             { label: "Instagram", url: "https://instagram.com" }
           ]
         };

         /* ---------------- THEME PICKER LOGIC ---------------- */
         function setThemeHue(hueVal) {
           const parsed = parseInt(hueVal, 10);
           const hue = Number.isNaN(parsed) ? DEFAULTS.themeHue : parsed;
           $('edit-theme-hue').value = String(hue);
           document.documentElement.style.setProperty('--hue', String(hue));
           document.querySelectorAll('#theme-swatches .theme-circle').forEach(btn => {
             btn.classList.toggle('active', parseInt(btn.getAttribute('data-hue'), 10) === hue);
           });
         }

         document.querySelectorAll('#theme-swatches .theme-circle').forEach(btn => {
           btn.addEventListener('click', () => {
             setThemeHue(btn.getAttribute('data-hue'));
           });
         });

         /* ---------------- dynamic builders ---------------- */
         window.removeRow = function(el) { el.parentElement.remove(); };

         // 1. Roles
         function addRoleInput(role = '') {
           const div = document.createElement('div');
           div.className = 'nested-row';
           div.innerHTML = `
             <input type="text" class="edit-input role-item" placeholder="Role (e.g., Role 1)">
             <i class="ri-close-line nested-remove-btn" onclick="removeRow(this)"></i>
           `;
           div.querySelector('.role-item').value = role || '';
           $('edit-roles-container').appendChild(div);
         }
         $('add-role-btn').addEventListener('click', () => addRoleInput());

         // 2. Projects (Limit: 10 Max)
         function addAdminProject(title = '', desc = '', imgUrl = '', link = '') {
           const container = $('edit-projects-container');
           if (container.querySelectorAll('.dynamic-row').length >= 10) {
             alert("Maximum 10 projects allowed.");
             return;
           }
           const div = document.createElement('div');
           div.className = 'dynamic-row';
           div.innerHTML = `
              <i class="ri-close-line remove-btn" onclick="removeRow(this)"></i>
              <input type="text" class="edit-input proj-title" placeholder="Project Title (e.g., Restaurant Website)">
              <textarea class="edit-textarea proj-desc" placeholder="Project Description"></textarea>
              <input type="text" class="edit-input proj-img" placeholder="Project Thumbnail Image URL">
              <input type="file" class="edit-input proj-img-file" accept="image/*" style="padding: 6px; font-size: 0.8rem; background: rgba(0,0,0,0.2);">
              <input type="text" class="edit-input proj-link" placeholder="Project Destination URL (Optional)">
           `;
           div.querySelector('.proj-title').value = title || '';
           div.querySelector('.proj-desc').value = desc || '';
           div.querySelector('.proj-img').value = imgUrl || '';
           div.querySelector('.proj-link').value = link || '';

           div.querySelector('.proj-img-file').addEventListener('change', function(e) {
             const file = e.target.files[0];
             if (!file) return;
             compressImageFile(file, 500, (dataUrl) => {
               div.querySelector('.proj-img').value = dataUrl;
             });
           });

           container.appendChild(div);
         }
         $('add-project-btn').addEventListener('click', () => addAdminProject());

         // 3. Services (Limit: 6 Max, up to 5 Perks each)
         function addPerkInput(perksContainer, perkText = '') {
           if (perksContainer.querySelectorAll('.nested-row').length >= 5) {
             alert("Maximum 5 bullet perks per service.");
             return;
           }
           const row = document.createElement('div');
           row.className = 'nested-row';
           row.innerHTML = `
             <input type="text" class="edit-input srv-perk" placeholder="Perk (e.g., Web development)">
             <i class="ri-close-line nested-remove-btn" onclick="removeRow(this)"></i>
           `;
           row.querySelector('.srv-perk').value = perkText || '';
           perksContainer.appendChild(row);
         }

         function addAdminService(name = '', desc = '', perks = ['']) {
           const container = $('edit-services-container');
           if (container.querySelectorAll('.dynamic-row').length >= 6) {
             alert("Maximum 6 services allowed.");
             return;
           }
           const div = document.createElement('div');
           div.className = 'dynamic-row';
           div.innerHTML = `
              <i class="ri-close-line remove-btn" onclick="removeRow(this)"></i>
              <input type="text" class="edit-input srv-name" placeholder="Service Title (e.g., Website Developer)">
              <textarea class="edit-textarea srv-desc" placeholder="Service Description"></textarea>
              <div class="srv-perks-list"></div>
              <button type="button" class="sub-add-btn">+ Add Perk (Max 5)</button>
           `;
           div.querySelector('.srv-name').value = name || '';
           div.querySelector('.srv-desc').value = desc || '';
           const perksList = div.querySelector('.srv-perks-list');
           (Array.isArray(perks) && perks.length ? perks : ['']).slice(0, 5).forEach(p => addPerkInput(perksList, p));
           div.querySelector('.sub-add-btn').addEventListener('click', () => addPerkInput(perksList, ''));
           container.appendChild(div);
         }
         $('add-service-btn').addEventListener('click', () => addAdminService());

         // 4. Skills Section (Max 5 Category Cards, multiple skill contents per card)
         function addSkillContentInput(skillsList, skillText = '') {
           const row = document.createElement('div');
           row.className = 'nested-row';
           row.innerHTML = `
             <input type="text" class="edit-input skill-item-input" placeholder="Skill Content (e.g., HTML)">
             <i class="ri-close-line nested-remove-btn" onclick="removeRow(this)"></i>
           `;
           row.querySelector('.skill-item-input').value = skillText || '';
           skillsList.appendChild(row);
         }

         function addAdminSkillCategory(catTitle = '', skills = ['']) {
           const container = $('edit-skills-container');
           if (container.querySelectorAll('.dynamic-row').length >= 5) {
             alert("Maximum 5 skill category cards allowed.");
             return;
           }
           const div = document.createElement('div');
           div.className = 'dynamic-row';
           div.innerHTML = `
              <i class="ri-close-line remove-btn" onclick="removeRow(this)"></i>
              <input type="text" class="edit-input skill-cat-title" placeholder="Category Title (e.g., Frontend)">
              <div class="skill-items-list"></div>
              <button type="button" class="sub-add-btn">+ Add Skill Content</button>
           `;
           div.querySelector('.skill-cat-title').value = catTitle || '';
           const skillsList = div.querySelector('.skill-items-list');
           (Array.isArray(skills) && skills.length ? skills : ['']).forEach(s => addSkillContentInput(skillsList, s));
           div.querySelector('.sub-add-btn').addEventListener('click', () => addSkillContentInput(skillsList, ''));
           container.appendChild(div);
         }
         $('add-skill-cat-btn').addEventListener('click', () => addAdminSkillCategory());

         // 5. Custom Sections (Max 3 Sections, 4 Layout Styles, Max 6 Cards/Blocks per Section)
         function addCustomCardItemInput(itemsList, getLayoutType, itemText = '') {
           if (getLayoutType() === 'services' && itemsList.querySelectorAll('.nested-row').length >= 5) {
             alert("Maximum 5 bullet points allowed for Bullet Card style.");
             return;
           }
           const row = document.createElement('div');
           row.className = 'nested-row';
           row.innerHTML = `
             <input type="text" class="edit-input custom-card-item" placeholder="Tag or Bullet item">
             <i class="ri-close-line nested-remove-btn" onclick="removeRow(this)"></i>
           `;
           row.querySelector('.custom-card-item').value = itemText || '';
           itemsList.appendChild(row);
         }

         function updateCustomCardVisibility(cardEl, layout) {
           const descEl = cardEl.querySelector('.custom-card-desc');
           const imgWrap = cardEl.querySelector('.custom-card-img-wrap');
           const linkWrap = cardEl.querySelector('.custom-card-link-wrap');
           const itemsWrap = cardEl.querySelector('.custom-card-items-wrap');
           const addItemBtn = cardEl.querySelector('.custom-add-item-btn');

           descEl.style.display = (layout === 'services' || layout === 'work' || layout === 'text') ? '' : 'none';
           imgWrap.style.display = (layout === 'work') ? '' : 'none';
           linkWrap.style.display = (layout === 'work') ? '' : 'none';
           itemsWrap.style.display = (layout === 'skills' || layout === 'services') ? '' : 'none';
           if (addItemBtn) {
             addItemBtn.innerText = layout === 'services' ? '+ Add Bullet Perk (Max 5)' : '+ Add Tag Item';
           }
         }

         function addCustomSectionCard(cardsList, getLayoutType, cardData = {}) {
           if (cardsList.querySelectorAll('.custom-card-box').length >= 6) {
             alert("Maximum 6 cards/blocks allowed per custom section.");
             return;
           }
           const box = document.createElement('div');
           box.className = 'custom-card-box';
           box.innerHTML = `
              <i class="ri-close-line remove-btn" onclick="removeRow(this)"></i>
              <input type="text" class="edit-input custom-card-title" placeholder="Card / Block Title">
              <textarea class="edit-textarea custom-card-desc" placeholder="Description / Details"></textarea>
              <div class="custom-card-img-wrap">
                 <input type="text" class="edit-input custom-card-img" placeholder="Thumbnail Image URL">
                 <input type="file" class="edit-input custom-card-img-file" accept="image/*" style="padding: 6px; font-size: 0.8rem; background: rgba(0,0,0,0.2);">
              </div>
              <div class="custom-card-link-wrap">
                 <input type="text" class="edit-input custom-card-link" placeholder="Redirect Link (Optional)">
              </div>
              <div class="custom-card-items-wrap">
                 <div class="custom-card-items-list"></div>
                 <button type="button" class="sub-add-btn custom-add-item-btn">+ Add Item</button>
              </div>
           `;
           box.querySelector('.custom-card-title').value = cardData.title || '';
           box.querySelector('.custom-card-desc').value = cardData.description || '';
           box.querySelector('.custom-card-img').value = cardData.imageUrl || '';
           box.querySelector('.custom-card-link').value = cardData.link || '';

           box.querySelector('.custom-card-img-file').addEventListener('change', function(e) {
             const file = e.target.files[0];
             if (!file) return;
             compressImageFile(file, 500, (dataUrl) => {
               box.querySelector('.custom-card-img').value = dataUrl;
             });
           });

           const itemsList = box.querySelector('.custom-card-items-list');
           const initialItems = Array.isArray(cardData.items) && cardData.items.length ? cardData.items : [''];
           initialItems.forEach(it => addCustomCardItemInput(itemsList, getLayoutType, it));

           box.querySelector('.custom-add-item-btn').addEventListener('click', () => {
             addCustomCardItemInput(itemsList, getLayoutType, '');
           });

           updateCustomCardVisibility(box, getLayoutType());
           cardsList.appendChild(box);
         }

         function addAdminCustomSection(secData = {}) {
           const container = $('edit-custom-sections-container');
           if (container.querySelectorAll('.custom-section-row').length >= 3) {
             alert("Maximum 3 custom sections allowed.");
             return;
           }
           const div = document.createElement('div');
           div.className = 'dynamic-row custom-section-row';
           div.innerHTML = `
              <i class="ri-close-line remove-btn" onclick="removeRow(this)"></i>
              <input type="text" class="edit-input custom-sec-title" placeholder="Section Title (e.g., Work Experience, Certifications)">
              <input type="text" class="edit-input custom-sec-subtitle" placeholder="Section Subtitle (Optional)">
              <label style="margin-top: 0.6rem;">Section Layout Style</label>
              <select class="edit-input custom-sec-type">
                 <option value="skills">1. Tag Card (Skills Style)</option>
                 <option value="services">2. Info + Bullets Card (Services Style)</option>
                 <option value="work">3. Image + Link Card (Work Style)</option>
                 <option value="text">4. Simple Text Block (About Style)</option>
              </select>
              <div class="custom-sec-cards-list"></div>
              <button type="button" class="sub-add-btn add-custom-card-btn">+ Add Card / Block to Section (Max 6)</button>
           `;

           const titleInp = div.querySelector('.custom-sec-title');
           const subInp = div.querySelector('.custom-sec-subtitle');
           const typeSelect = div.querySelector('.custom-sec-type');
           const cardsList = div.querySelector('.custom-sec-cards-list');

           titleInp.value = secData.sectionTitle || '';
           subInp.value = secData.sectionSubtitle || '';
           typeSelect.value = ['skills', 'services', 'work', 'text'].includes(secData.layoutType) ? secData.layoutType : 'skills';

           const getLayoutType = () => typeSelect.value;

           typeSelect.addEventListener('change', () => {
             const currentLayout = getLayoutType();
             cardsList.querySelectorAll('.custom-card-box').forEach(cardEl => {
               updateCustomCardVisibility(cardEl, currentLayout);
             });
           });

           const initialCards = Array.isArray(secData.cards) && secData.cards.length ? secData.cards : [{}];
           initialCards.slice(0, 6).forEach(c => addCustomSectionCard(cardsList, getLayoutType, c));

           div.querySelector('.add-custom-card-btn').addEventListener('click', () => {
             addCustomSectionCard(cardsList, getLayoutType, {});
           });

           container.appendChild(div);
         }
         $('add-custom-section-btn').addEventListener('click', () => addAdminCustomSection());

         // 6. Connect Redirect Buttons
         function addAdminLink(label = '', url = '') {
           const div = document.createElement('div');
           div.className = 'dynamic-row';
           div.innerHTML = `
              <i class="ri-close-line remove-btn" onclick="removeRow(this)"></i>
              <input type="text" class="edit-input link-label" placeholder="Button Name (e.g., Instagram)">
              <input type="text" class="edit-input link-url" placeholder="Link to Redirect (https://...)">
           `;
           div.querySelector('.link-label').value = label || '';
           div.querySelector('.link-url').value = url || '';
           $('edit-links-container').appendChild(div);
         }
         $('add-link-btn').addEventListener('click', () => addAdminLink());

         /* ---------------- profile photo upload & URL preview ---------------- */
         $('edit-avatar-file').addEventListener('change', function(e) {
           const file = e.target.files[0];
           if (!file) return;
           compressImageFile(file, 400, (dataUrl) => {
             $('edit-avatar-url').value = dataUrl;
             $('avatar-preview').src = dataUrl;
             $('avatar-preview').style.display = 'block';
           });
         });

         $('edit-avatar-url').addEventListener('input', function() {
           const valid = safeImageSrc(this.value);
           if (valid) {
             $('avatar-preview').src = valid;
             $('avatar-preview').style.display = 'block';
           }
         });

         /* ---------------- load: owner-only with Default Fallbacks ---------------- */
         function populate(data) {
           setThemeHue(data.themeHue !== undefined && data.themeHue !== null && data.themeHue !== '' ? data.themeHue : DEFAULTS.themeHue);

           $('edit-hero-name').value = data.heroName !== undefined ? data.heroName : DEFAULTS.heroName;

           const roles = Array.isArray(data.heroRoles) ? data.heroRoles : DEFAULTS.heroRoles;
           roles.forEach(r => addRoleInput(r));

           const tag = data.heroTag !== undefined ? data.heroTag : (data.description !== undefined ? data.description : DEFAULTS.heroTag);
           $('edit-hero-tag').value = tag;

           const avatar = safeImageSrc(data.profileImageUrl || data.avatar);
           if (avatar) {
             $('edit-avatar-url').value = avatar;
             $('avatar-preview').src = avatar;
             $('avatar-preview').style.display = 'block';
           }

           $('edit-about-title').value = data.aboutTitle !== undefined ? data.aboutTitle : DEFAULTS.aboutTitle;

           const projects = Array.isArray(data.projects) ? data.projects : DEFAULTS.projects;
           projects.slice(0, 10).forEach(p => addAdminProject(
             p.projectTitle !== undefined ? p.projectTitle : p.title,
             p.projectDescription !== undefined ? p.projectDescription : p.description,
             p.projectImageUrl || 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80',
             p.projectLink !== undefined ? p.projectLink : p.link
           ));

           const services = Array.isArray(data.services) ? data.services : DEFAULTS.services;
           services.slice(0, 6).forEach(s => addAdminService(s.serviceName, s.serviceDescription, s.servicePerks));

           const skillCategories = Array.isArray(data.skillCategories) ? data.skillCategories : DEFAULTS.skillCategories;
           skillCategories.slice(0, 5).forEach(c => addAdminSkillCategory(c.categoryTitle, c.skills));

           if (Array.isArray(data.customSections)) {
             data.customSections.slice(0, 3).forEach(sec => addAdminCustomSection(sec));
           }

           $('edit-phone').value = data.phoneNumber !== undefined ? data.phoneNumber : DEFAULTS.phoneNumber;

           const links = Array.isArray(data.links) ? data.links : DEFAULTS.links;
           links.forEach(l => addAdminLink(l.label, l.url));
         }

         async function init() {
           if (!slugIsValid) { window.location.replace('index.html'); return; }

           try {
             await withTimeout(auth.authStateReady());
             const user = auth.currentUser;

             // Not signed in: this page is not for you. Show the public profile (never bounce to claim.html -> no loops).
             if (!user) { goToProfile(); return; }

             const snap = await withTimeout(getDoc(doc(db, "DigitalCard", userSlug)));

             // Unclaimed card: it can only be claimed with a click on claim.html, never from here.
             if (!snap.exists()) { goToProfile(); return; }

             const data = snap.data();
             if (data.ownerUid !== user.uid) {
               alert("Unauthorized. You do not own this card.");
               goToProfile();
               return;
             }

             populate(data);
             loader.style.display = 'none';
           } catch (err) {
             console.error("Load Error:", err);
             showLoadError();
           }
         }

         /* ---------------- sign out / cancel ---------------- */
         $('edit-close-btn').addEventListener('click', goToProfile);

         $('edit-logout-btn').addEventListener('click', async () => {
           try { await signOut(auth); } catch (err) { console.error("Sign-out error:", err); }
           goToProfile();
         });

         /* ---------------- save ---------------- */
         let saving = false;
         $('edit-save-btn').addEventListener('click', async () => {
           if (saving) return;
           const btn = $('edit-save-btn');
           const idleLabel = btn.innerText;

           if (!auth.currentUser) { goToProfile(); return; }

           const phoneNumber = $('edit-phone').value.trim();
           if (!phoneNumber) {
             alert("Mobile number is compulsory. Please enter a mobile number.");
             $('edit-phone').focus();
             return;
           }

           const parsedHue = parseInt($('edit-theme-hue').value, 10);
           const themeHue = Number.isNaN(parsedHue) ? DEFAULTS.themeHue : parsedHue;

           const heroName = $('edit-hero-name').value.trim() || DEFAULTS.heroName;
           const heroRoles = [];
           document.querySelectorAll('#edit-roles-container .role-item').forEach(inp => {
             const val = inp.value.trim();
             if (val) heroRoles.push(val);
           });

           const heroTag = $('edit-hero-tag').value.trim();
           const rawAvatar = $('edit-avatar-url').value.trim();
           const profileImageUrl = safeImageSrc(rawAvatar);
           const aboutTitle = $('edit-about-title').value.trim();

           const badLinks = [];
           if (rawAvatar && !profileImageUrl) badLinks.push(rawAvatar);

           const projects = [];
           document.querySelectorAll('#edit-projects-container .dynamic-row').forEach(row => {
             const projectTitle = row.querySelector('.proj-title').value.trim();
             const projectDescription = row.querySelector('.proj-desc').value.trim();
             const rawImg = row.querySelector('.proj-img').value.trim();
             const rawLink = row.querySelector('.proj-link').value.trim();
             if (!projectTitle) return;
             const projectImageUrl = safeImageSrc(rawImg);
             if (rawImg && !projectImageUrl) badLinks.push(rawImg);
             const projectLink = normalizeUrl(rawLink, ['http:', 'https:']);
             if (rawLink && !projectLink) badLinks.push(rawLink);
             projects.push({
               projectTitle,
               projectDescription,
               projectImageUrl,
               projectLink,
               title: projectTitle,
               description: projectDescription,
               link: projectLink
             });
           });

           const services = [];
           document.querySelectorAll('#edit-services-container .dynamic-row').forEach(row => {
             const serviceName = row.querySelector('.srv-name').value.trim();
             const serviceDescription = row.querySelector('.srv-desc').value.trim();
             if (!serviceName) return;
             const servicePerks = [];
             row.querySelectorAll('.srv-perk').forEach(p => {
               const val = p.value.trim();
               if (val) servicePerks.push(val);
             });
             services.push({ serviceName, serviceDescription, servicePerks: servicePerks.slice(0, 5) });
           });

           const skillCategories = [];
           document.querySelectorAll('#edit-skills-container .dynamic-row').forEach(row => {
             const categoryTitle = row.querySelector('.skill-cat-title').value.trim();
             if (!categoryTitle) return;
             const skills = [];
             row.querySelectorAll('.skill-item-input').forEach(s => {
               const val = s.value.trim();
               if (val) skills.push(val);
             });
             skillCategories.push({ categoryTitle, skills });
           });

           const customSections = [];
           document.querySelectorAll('#edit-custom-sections-container .custom-section-row').forEach(secRow => {
             const sectionTitle = secRow.querySelector('.custom-sec-title').value.trim();
             const sectionSubtitle = secRow.querySelector('.custom-sec-subtitle').value.trim();
             const layoutType = secRow.querySelector('.custom-sec-type').value;
             if (!sectionTitle) return;

             const cards = [];
             secRow.querySelectorAll('.custom-card-box').forEach(cardEl => {
               const title = cardEl.querySelector('.custom-card-title').value.trim();
               const description = cardEl.querySelector('.custom-card-desc').value.trim();
               const rawImg = cardEl.querySelector('.custom-card-img').value.trim();
               const rawLink = cardEl.querySelector('.custom-card-link').value.trim();
               if (!title) return;

               let imageUrl = '';
               let link = '';
               if (layoutType === 'work') {
                 imageUrl = safeImageSrc(rawImg);
                 if (rawImg && !imageUrl) badLinks.push(rawImg);
                 link = normalizeUrl(rawLink, ['http:', 'https:']);
                 if (rawLink && !link) badLinks.push(rawLink);
               }

               const items = [];
               if (layoutType === 'skills' || layoutType === 'services') {
                 cardEl.querySelectorAll('.custom-card-item').forEach(it => {
                   const val = it.value.trim();
                   if (val) items.push(val);
                 });
               }

               cards.push({
                 title,
                 description,
                 imageUrl,
                 link,
                 items: layoutType === 'services' ? items.slice(0, 5) : items
               });
             });

             customSections.push({
               sectionTitle,
               sectionSubtitle,
               layoutType,
               cards: cards.slice(0, 6)
             });
           });

           const links = [];
           document.querySelectorAll('#edit-links-container .dynamic-row').forEach(row => {
             const label = row.querySelector('.link-label').value.trim();
             const rawUrl = row.querySelector('.link-url').value.trim();
             if (!(label && rawUrl)) return;
             const url = normalizeUrl(rawUrl);
             if (!url) { badLinks.push(rawUrl); return; }
             links.push({ label, url });
           });

           if (badLinks.length) {
             alert(`This link can't be used: "${badLinks[0]}"\nPlease use a normal web address (https://...), mailto: or tel: link.`);
             return;
           }

           // ownerUid and name are never sent: ownership can't be changed from this form.
           const payload = {
             themeHue,
             heroName,
             heroRoles,
             heroTag,
             description: heroTag,
             profileImageUrl,
             avatar: profileImageUrl,
             aboutTitle,
             projects: projects.slice(0, 10),
             services: services.slice(0, 6),
             skillCategories: skillCategories.slice(0, 5),
             customSections: customSections.slice(0, 3),
             phoneNumber,
             links
           };

           if (JSON.stringify(payload).length > 900000) {
             alert("Your profile is too large to save. Please use a smaller photo.");
             return;
           }

           saving = true;
           btn.innerText = "Saving...";

           try {
             await withTimeout(updateDoc(doc(db, "DigitalCard", userSlug), payload), 20000);
             btn.innerText = "Success!";
             btn.style.background = "#00ff00";
             btn.style.color = "#000";
             // Keep the page fully visible until the redirect happens (nothing is torn down here).
             setTimeout(goToProfile, 800);
           } catch (error) {
             console.error("Save Error:", error);
             btn.innerText = "Error Saving";
             // Let the person retry instead of leaving a dead button.
             setTimeout(() => { btn.innerText = idleLabel; saving = false; }, 2500);
           }
         });

         // Coming back via the browser's Back button must re-check the real state instead of showing a stale form.
         window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });

         init();
      </script>
   </body>
</html>
