/*=============== YOUR EXACT CSS (100% UNTOUCHED) ===============*/
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Syne:wght@400..800&display=swap");
:root { --header-height: 3.5rem; --hue: 110; --first-color: hsl(var(--hue), 90%, 40%); --white-color: hsl(var(--hue), 24%, 98%); --black-color: hsl(var(--hue), 12%, 8%); --text-color: hsl(var(--hue), 4%, 70%); --body-color: hsl(var(--hue), 12%, 4%); --container-color: hsl(var(--hue), 45%, 12%); --body-font: "Poppins", sans-serif; --small-font-size: .813rem; }
* { box-sizing: border-box; padding: 0; margin: 0; }
body { background-color: var(--body-color); color: var(--text-color); font-family: var(--body-font); display: flex; justify-content: center; align-items: flex-start; padding: 2rem 1rem; }
input, button, textarea, select { border: none; outline: none; background: none; }
.button { display: inline-flex; align-items: center; justify-content: center; column-gap: .5rem; background-color: var(--first-color); color: var(--black-color); padding: 1rem 2rem; border-radius: 4rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
.button:hover { box-shadow: 0 8px 24px hsla(var(--hue), 75%, 60%, 0.3); }

.edit-modal-content { background: var(--container-color); padding: 2rem; border-radius: 1rem; width: 100%; max-width: 550px; border: 1px solid var(--first-color); margin: 2rem auto; }
.edit-modal-content h2 { border-bottom: 1px solid var(--first-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem; color: var(--white-color); }
.edit-modal-content h3 { margin-top: 2rem; padding-bottom: 0.4rem; border-bottom: 1px solid #333; color: var(--white-color); font-size: 1.05rem; }
.edit-modal-content label { display: block; margin-top: 1.2rem; margin-bottom: 0.5rem; color: var(--first-color); font-size: var(--small-font-size); text-transform: uppercase; letter-spacing: 1px; }
.edit-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #333; color: var(--white-color); padding: 12px; border-radius: 6px; font-family: var(--body-font); margin-bottom: 0.5rem; }
.edit-input:focus { border-color: var(--first-color); }
.edit-input option { background: #141414; color: var(--white-color); }
.edit-textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #333; color: var(--white-color); padding: 12px; border-radius: 6px; font-family: var(--body-font); margin-bottom: 0.8rem; resize: vertical; min-height: 80px; }
.edit-textarea:focus { border-color: var(--first-color); }
.dynamic-row { background: rgba(255,255,255,0.03); border: 1px solid #222; padding: 1.2rem 1rem 1rem; border-radius: 6px; margin-bottom: 1rem; position: relative; }
.custom-card-box { background: rgba(0,0,0,0.35); border: 1px solid #2a2a2a; padding: 1rem; border-radius: 6px; margin-top: 0.75rem; position: relative; }
.nested-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.nested-row .edit-input { margin-bottom: 0; }
.remove-btn { position: absolute; top: 0.5rem; right: 0.5rem; color: var(--first-color); font-size: 1.2rem; cursor: pointer; }
.nested-remove-btn { color: var(--first-color); font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
.add-btn { background: transparent; border: 1px dashed var(--first-color); color: var(--first-color); padding: 0.8rem; width: 100%; text-transform: uppercase; cursor: pointer; font-weight: bold; margin-top: 0.5rem; transition: 0.3s; border-radius: 6px;}
.add-btn:hover { background: hsla(var(--hue), 75%, 60%, 0.1); }
.sub-add-btn { background: transparent; border: 1px dashed #555; color: var(--white-color); padding: 0.5rem; width: 100%; font-size: 0.78rem; text-transform: uppercase; cursor: pointer; margin-top: 0.4rem; border-radius: 6px; }
.sub-add-btn:hover { border-color: var(--first-color); color: var(--first-color); }
.edit-actions { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }

/* Theme Color Swatches */
.theme-swatches { display: flex; gap: 0.85rem; flex-wrap: wrap; margin-top: 0.5rem; margin-bottom: 0.5rem; }
.theme-circle { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
.theme-circle:hover { transform: scale(1.12); }
.theme-circle.active { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 12px rgba(255,255,255,0.6); }

/* Built-in sections: editable heading + one-click delete cross */
.sec-block > h3 { position: relative; padding-right: 2rem; }
.sec-block > h3 .remove-btn { top: 50%; right: 0; transform: translateY(-50%); }
.sec-block > h3 .remove-btn:focus-visible { outline: 2px solid var(--first-color); border-radius: 4px; }
.title-preview { font-family: "Syne", var(--body-font); font-weight: 600; font-size: 1.4rem; line-height: 1.25; color: var(--white-color); margin: 0 0 1rem; word-break: break-word; }
.title-preview span { color: var(--first-color); }
.title-preview:empty { display: none; }

#loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--body-color); display: flex; justify-content: center; align-items: center; z-index: 9999; }
.spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--first-color); animation: spin 1s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Photo cropper, upload status, previews ---- */
.crop-modal { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,0.88); }
.crop-modal[hidden] { display: none; }
.crop-panel { width: 100%; max-width: 760px; max-height: 100%; overflow-y: auto; background: var(--container-color); border: 1px solid var(--first-color); border-radius: 1rem; padding: 1.1rem; }
.crop-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; color: var(--white-color); }
.crop-step { color: var(--first-color); font-size: var(--small-font-size); }
.crop-help { color: var(--text-color); font-size: var(--small-font-size); margin: .4rem 0 .9rem; line-height: 1.5; }
.crop-stage { position: relative; width: fit-content; max-width: calc(100% - 24px); margin: 12px auto; touch-action: none; user-select: none; -webkit-user-select: none; line-height: 0; }
.crop-img { display: block; max-width: 100%; max-height: 50vh; width: auto; height: auto; pointer-events: none; -webkit-user-drag: none; border-radius: 4px; }
.crop-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.62); pointer-events: none; border-radius: 4px; }
.crop-box { position: absolute; border: 2px solid var(--first-color); cursor: move; touch-action: none; box-sizing: border-box;
  background-image: linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px) calc(33.33% + .5px), transparent calc(33.33% + .5px) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
                    linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px) calc(33.33% + .5px), transparent calc(33.33% + .5px) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
.crop-h { position: absolute; width: 22px; height: 22px; background: var(--first-color); border: 2px solid #fff; border-radius: 50%; touch-action: none; box-sizing: border-box; }
.crop-h[data-h="nw"] { left: -11px; top: -11px; cursor: nwse-resize; }
.crop-h[data-h="ne"] { right: -11px; top: -11px; cursor: nesw-resize; }
.crop-h[data-h="sw"] { left: -11px; bottom: -11px; cursor: nesw-resize; }
.crop-h[data-h="se"] { right: -11px; bottom: -11px; cursor: nwse-resize; }
.crop-chips { display: flex; gap: .5rem; justify-content: center; margin: .5rem 0 .4rem; }
.crop-chip { padding: .4rem .9rem; border: 1px solid #444; border-radius: 2rem; color: var(--white-color); font-size: var(--small-font-size); cursor: pointer; }
.crop-chip.active { border-color: var(--first-color); color: var(--first-color); }
.crop-actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: flex-end; margin-top: .8rem; }
.crop-btn { padding: .7rem 1.1rem; border-radius: 2rem; font-weight: 600; font-size: .85rem; cursor: pointer; }
.crop-btn.ghost { border: 1px solid #555; color: var(--white-color); }
.crop-btn.primary { background: var(--first-color); color: #fff; }
.img-status { display: block; margin: -.2rem 0 .5rem; font-size: var(--small-font-size); color: var(--text-color); }
.img-status:empty { display: none; }
.img-status.ok { color: #6fdc8c; } .img-status.warn { color: #ffb347; } .img-status.bad { color: #ff6b6b; }
.img-preview { display: none; width: 100%; max-width: 240px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; border: 1px solid #333; margin-bottom: .6rem; }
.storage-notice { margin: 0 0 1.2rem; padding: .8rem 1rem; border: 1px solid #ffb347; border-radius: 8px; color: #ffb347; font-size: var(--small-font-size); line-height: 1.55; }
/* Avatar Preview Shapes */
.avatar-preview-wrap { display: inline-block; line-height: 0; }
.avatar-preview-wrap:has(.shape-penta, .shape-hexa, .shape-heptagon) {
  filter:
    drop-shadow(1.5px 0 0 var(--first-color))
    drop-shadow(-1.5px 0 0 var(--first-color))
    drop-shadow(0 1.5px 0 var(--first-color))
    drop-shadow(0 -1.5px 0 var(--first-color));
}
#avatar-preview.shape-window    { border-radius: 20rem 20rem 2rem 2rem !important; aspect-ratio: 1/1; height: auto !important; clip-path: none; }
#avatar-preview.shape-circle    { border-radius: 50% !important; aspect-ratio: 1/1; height: auto !important; clip-path: none; }
#avatar-preview.shape-square    { border-radius: 12px !important; aspect-ratio: 1/1; height: auto !important; clip-path: none; }
#avatar-preview.shape-rectangle { border-radius: 12px !important; aspect-ratio: 3/4; height: auto !important; clip-path: none; }
#avatar-preview.shape-penta     { border-radius: 0 !important; border: none !important; aspect-ratio: 1/1; height: auto !important; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
#avatar-preview.shape-hexa      { border-radius: 0 !important; border: none !important; aspect-ratio: 1/1; height: auto !important; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
#avatar-preview.shape-heptagon  { border-radius: 0 !important; border: none !important; aspect-ratio: 1/1; height: auto !important; clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%); }

body { padding-bottom: 5.5rem; }
#edit-save-btn.floating-save {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 9500;
  padding: 0.9rem 1.8rem !important;
  border: 2px solid var(--white-color) !important;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75), 0 0 20px hsla(var(--hue), 90%, 40%, 0.45);
  animation: popFloatingSave 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
@keyframes popFloatingSave {
  from { transform: translateY(20px) scale(0.9); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
      </style>

      <script type="module">

         const firebaseConfig = {

         /* ---------------- helpers ---------------- */

         const withTimeout = (promise, ms = 15000) =>
           Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);

         // A valid phone number is either 10 digits (98765 43210) or "+" + country code + number (+91 98765 43210).
         // Spaces, dashes, dots and brackets are allowed. Returns the tidy number, or '' when it is not valid.
         // (Only the format is checked, not whether the number really exists.)
         function normalizePhone(raw) {
           const value = String(raw ?? '').trim();
           if (!value) return '';
           if (!/^\+?[\d\s().-]+$/.test(value)) return '';
           const digits = value.replace(/\D/g, '');
           if (value.startsWith('+')) {
             if (digits.startsWith('91')) {
               return digits.length === 12 ? `+91 ${digits.slice(2, 7)} ${digits.slice(7)}` : '';
             }
             return /^[1-9]\d{10,14}$/.test(digits) ? '+' + digits : '';
           }
           return digits.length === 10 ? `${digits.slice(0, 5)} ${digits.slice(5)}` : '';
         }

         // Only REAL links are accepted: a proper domain (name.com), no spaces, no user:password@ tricks,
         // and only http(s) / mailto / tel (blocks javascript: URLs). A bare domain gets https://, a bare email gets mailto:
         const EMAIL_RE = /^[^\s@:/]+@[^\s@:/]+\.[a-z]{2,}$/i;
         function normalizeUrl(raw, protocols = ['http:', 'https:', 'mailto:', 'tel:']) {
           const value = String(raw ?? '').trim();
           if (!value || /\s/.test(value)) return '';
           const hasScheme = /^(https?:\/\/|mailto:|tel:)/i.test(value);
           if (!hasScheme && EMAIL_RE.test(value)) return protocols.includes('mailto:') ? 'mailto:' + value : '';
           try {
             const url = new URL(hasScheme ? value : 'https://' + value);
             if (!protocols.includes(url.protocol)) return '';
             if (url.protocol === 'http:' || url.protocol === 'https:') {
               if (url.username || url.password) return '';
               if (!/^([a-z0-9-]+\.)+([a-z]{2,}|xn--[a-z0-9-]+)$/i.test(url.hostname)) return '';
             } else if (url.protocol === 'mailto:') {
               if (!EMAIL_RE.test(decodeURIComponent(url.pathname))) return '';
             } else if (url.protocol === 'tel:') {
               if (!normalizePhone(decodeURIComponent(url.pathname))) return '';
             }
             return url.href;
           } catch (_) { return ''; }
         }

         // A red border marks a rejected field; it clears as soon as the person edits it.
         document.addEventListener('input', (e) => { if (e.target && e.target.style) e.target.style.borderColor = ''; });

         function safeImageSrc(src) {
           const value = String(src ?? '').trim();
           if (/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(value)) return value;
           return normalizeUrl(value, ['http:', 'https:']);
         }

/* ======================================================================================
           PHOTOS:  pick  ->  crop  ->  resize (sharp)  ->  upload to Firebase Storage  ->  only the URL goes into the card.
           Photos used to be stored as text INSIDE the card document. Firestore limits a whole document to
           1 MB, so 4-5 good photos filled it up ("file too big"). Now every photo is its own file in Storage.
           ====================================================================================== */
         const IMAGE_MAX_EDGE = 1920;        // longest side in pixels (full-HD: sharp even on retina phones)
         const IMAGE_QUALITY = 0.92;         // WebP quality (visually lossless)
         const INLINE_FALLBACK_MAX_CHARS = 140000;

         let pendingUploads = 0;
         let storageProblem = null;
         const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));

         function showStorageNotice() {
           if ($('storage-notice')) return;
           const note = document.createElement('div');
           note.id = 'storage-notice';
           note.className = 'storage-notice';
           const code = storageProblem && (storageProblem.code || storageProblem.message) ? ` (${storageProblem.code || storageProblem.message})` : '';
           note.textContent = "Cloud photo storage is not set up for this project yet, so photos are being kept at a reduced size inside the card (only a few fit). To keep full quality and add as many photos as you like, enable Firebase Storage and publish the storage rules." + code;
           const h2 = document.querySelector('.edit-modal-content h2');
           if (h2) h2.insertAdjacentElement('afterend', note);
         }

         const canvasToBlob = (canvas, type, quality) => new Promise((resolve) => canvas.toBlob(resolve, type, quality));
         const blobToDataUrl = (blob) => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(blob); });

         function scaleCanvas(canvas, maxEdge) {
           const k = Math.min(1, maxEdge / Math.max(canvas.width, canvas.height));
           if (k >= 1) return canvas;
           const c = document.createElement('canvas');
           c.width = Math.max(1, Math.round(canvas.width * k)); c.height = Math.max(1, Math.round(canvas.height * k));
           const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
           ctx.drawImage(canvas, 0, 0, c.width, c.height);
           return c;
         }

         // WebP where the browser supports it, otherwise JPEG (flattened on white so transparency doesn't turn black)
         async function encodeCanvas(canvas, quality = IMAGE_QUALITY) {
           const webp = await canvasToBlob(canvas, 'image/webp', quality);
           if (webp && webp.type === 'image/webp') return webp;
           const flat = document.createElement('canvas'); flat.width = canvas.width; flat.height = canvas.height;
           const fctx = flat.getContext('2d'); fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, flat.width, flat.height); fctx.drawImage(canvas, 0, 0);
           return canvasToBlob(flat, 'image/jpeg', quality);
         }

         async function uploadImageBlob(blob) {
           const ext = blob.type === 'image/webp' ? 'webp' : (blob.type === 'image/png' ? 'png' : 'jpg');
           const name = `cards/${userSlug}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
           const r = storageRef(storage, name);
           await withTimeout(uploadBytes(r, blob, { contentType: blob.type, cacheControl: 'public,max-age=31536000,immutable' }), 45000);
           return withTimeout(getDownloadURL(r), 15000);
         }

         // 1) Cloud Storage at full quality.  2) If Storage isn't available: a small copy kept inside the card.
         async function storeImage(canvas) {
           try {
             const url = await uploadImageBlob(await encodeCanvas(canvas));
             return { url, inline: false };
           } catch (err) {
             console.warn('Cloud Storage upload failed, using the small inline copy instead:', err);
             storageProblem = err; showStorageNotice();
             let dataUrl = '';
             for (const edge of [1100, 900, 720, 560]) {
               dataUrl = await blobToDataUrl(await encodeCanvas(scaleCanvas(canvas, edge), 0.85));
               if (dataUrl.length <= INLINE_FALLBACK_MAX_CHARS) break;
             }
             return { url: dataUrl, inline: true };
           }
         }

         function setStatus(el, text, kind = '') { if (el) { el.textContent = text; el.className = 'img-status ' + kind; } }

         async function uploadIntoField(canvas, urlInput, statusEl, onDone) {
           pendingUploads++;
           setStatus(statusEl, 'Uploading photo...');
           try {
             const r = await storeImage(canvas);
             urlInput.value = r.url;
             setStatus(statusEl, r.inline ? 'Kept at reduced size (cloud storage not set up yet)' : 'Photo uploaded', r.inline ? 'warn' : 'ok');
             if (onDone) onDone();
           } catch (err) {
             console.error('Photo upload failed:', err);
             setStatus(statusEl, 'Upload failed - please try again', 'bad');
           } finally { pendingUploads--; }
         }

         /* ---------------- the crop window ---------------- */
         let cropModalEl = null;
         function ensureCropModal() {
           if (cropModalEl) return cropModalEl;
           const m = document.createElement('div');
           m.className = 'crop-modal'; m.hidden = true;
           m.innerHTML = `
             <div class="crop-panel" role="dialog" aria-modal="true" aria-label="Crop photo">
               <div class="crop-head"><strong class="crop-title">Crop photo</strong><span class="crop-step"></span></div>
               <p class="crop-help">Drag the box to choose what to keep. Drag a corner to make it bigger or smaller. Everything outside the box is removed.</p>
               <div class="crop-stage">
                 <img class="crop-img" alt="">
                 <div class="crop-dim"></div>
                 <div class="crop-box"><i class="crop-h" data-h="nw"></i><i class="crop-h" data-h="ne"></i><i class="crop-h" data-h="sw"></i><i class="crop-h" data-h="se"></i></div>
               </div>
               <div class="crop-chips">
                 <button type="button" class="crop-chip active" data-mode="lock">Fit shape</button>
                 <button type="button" class="crop-chip" data-mode="free">Free crop</button>
               </div>
               <div class="crop-actions">
                 <button type="button" class="crop-btn ghost" data-act="cancel">Cancel</button>
                 <button type="button" class="crop-btn ghost" data-act="skip">Skip this photo</button>
                 <button type="button" class="crop-btn ghost" data-act="full">Use full photo</button>
                 <button type="button" class="crop-btn primary" data-act="ok">Crop &amp; Use</button>
               </div>
             </div>`;
           document.body.appendChild(m);
           cropModalEl = m;
           return m;
         }

         // Resolves to { canvas } (cropped / full photo), { skipped: true } or { aborted: true }
         function openCropper(file, { aspect = null, title = 'Crop photo', step = '', bulk = false } = {}) {
           return new Promise((resolve) => {
             const m = ensureCropModal();
             const img = m.querySelector('.crop-img'), stage = m.querySelector('.crop-stage'), box = m.querySelector('.crop-box'), dim = m.querySelector('.crop-dim');
             const chips = m.querySelector('.crop-chips');
             const MIN = 48;
             let dw = 0, dh = 0, nw = 0, nh = 0, mode = aspect ? 'lock' : 'free', drag = null;
             const b = { x: 0, y: 0, w: 0, h: 0 };
             const url = URL.createObjectURL(file);

             m.querySelector('.crop-title').textContent = title;
             m.querySelector('.crop-step').textContent = step;
             m.querySelector('[data-act="skip"]').style.display = bulk ? '' : 'none';
             m.querySelector('[data-act="cancel"]').textContent = bulk ? 'Cancel all' : 'Cancel';
             chips.style.display = aspect ? '' : 'none';
             const lockChip = chips.querySelector('[data-mode="lock"]');
             lockChip.textContent = aspect && Math.abs(aspect - 1) < 0.01 ? 'Square' : (aspect ? 'Card shape (16:9)' : 'Fit shape');
             const setChips = () => chips.querySelectorAll('.crop-chip').forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
             setChips();

             const render = () => {
               box.style.left = b.x + 'px'; box.style.top = b.y + 'px'; box.style.width = b.w + 'px'; box.style.height = b.h + 'px';
               const x1 = b.x, y1 = b.y, x2 = b.x + b.w, y2 = b.y + b.h;
               dim.style.clipPath = `polygon(evenodd, 0 0, ${dw}px 0, ${dw}px ${dh}px, 0 ${dh}px, 0 0, ${x1}px ${y1}px, ${x1}px ${y2}px, ${x2}px ${y2}px, ${x2}px ${y1}px, ${x1}px ${y1}px)`;
             };
             const fitBox = () => {
               if (mode === 'lock' && aspect) {
                 let w = dw, h = w / aspect;
                 if (h > dh) { h = dh; w = h * aspect; }
                 b.w = w; b.h = h; b.x = (dw - w) / 2; b.y = (dh - h) / 2;
               } else { b.x = 0; b.y = 0; b.w = dw; b.h = dh; }
             };
             const measure = () => { dw = img.clientWidth; dh = img.clientHeight; };

             const onDown = (e) => {
               const h = e.target.closest ? e.target.closest('.crop-h') : null;
               drag = { type: h ? 'resize' : 'move', h: h ? h.dataset.h : '', sx: e.clientX, sy: e.clientY, b: { ...b } };
               try { box.setPointerCapture(e.pointerId); } catch (_) {}
               e.preventDefault();
             };
             const onMove = (e) => {
               if (!drag) return;
               if (drag.type === 'move') {
                 b.x = clamp(drag.b.x + (e.clientX - drag.sx), 0, dw - b.w);
                 b.y = clamp(drag.b.y + (e.clientY - drag.sy), 0, dh - b.h);
               } else {
                 const r = stage.getBoundingClientRect();
                 const px = clamp(e.clientX - r.left, 0, dw), py = clamp(e.clientY - r.top, 0, dh);
                 const east = drag.h.includes('e'), south = drag.h.includes('s');
                 const ax = east ? drag.b.x : drag.b.x + drag.b.w;           // the opposite corner stays where it is
                 const ay = south ? drag.b.y : drag.b.y + drag.b.h;
                 const roomX = east ? dw - ax : ax, roomY = south ? dh - ay : ay;
                 let w = (east ? px >= ax : px <= ax) ? Math.abs(px - ax) : 0;
                 let h = (south ? py >= ay : py <= ay) ? Math.abs(py - ay) : 0;
                 if (mode === 'lock' && aspect) {
                   const maxW = Math.min(roomX, roomY * aspect);
                   w = clamp(Math.max(w, h * aspect), Math.min(MIN, maxW), maxW);
                   h = w / aspect;
                 } else {
                   w = clamp(w, Math.min(MIN, roomX), roomX); h = clamp(h, Math.min(MIN, roomY), roomY);
                 }
                 b.w = w; b.h = h; b.x = east ? ax : ax - w; b.y = south ? ay : ay - h;
               }
               render();
             };
             const onUp = () => { drag = null; };
             box.addEventListener('pointerdown', onDown);
             box.addEventListener('pointermove', onMove);
             box.addEventListener('pointerup', onUp);
             box.addEventListener('pointercancel', onUp);

             const onChip = (e) => {
               const c = e.target.closest('.crop-chip'); if (!c) return;
               mode = c.dataset.mode; setChips();
               if (mode === 'lock') { fitBox(); render(); }
             };
             chips.addEventListener('click', onChip);

             const onResize = () => {
               if (!dw) return;
               const ow = dw, oh = dh; measure(); if (!dw) return;
               b.x *= dw / ow; b.w *= dw / ow; b.y *= dh / oh; b.h *= dh / oh; render();
             };
             window.addEventListener('resize', onResize);

             // Turns the chosen box (or the full photo) into a canvas at the photo's real resolution, capped at IMAGE_MAX_EDGE.
             const makeCanvas = (full) => {
               const k = nw / dw;
               const rx = full ? 0 : b.x * k, ry = full ? 0 : b.y * k;
               const sw = Math.min(full ? nw : b.w * k, nw - rx), sh = Math.min(full ? nh : b.h * k, nh - ry);
               const scale = Math.min(1, IMAGE_MAX_EDGE / Math.max(sw, sh));
               const c = document.createElement('canvas');
               c.width = Math.max(1, Math.round(sw * scale)); c.height = Math.max(1, Math.round(sh * scale));
               const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
               ctx.drawImage(img, rx, ry, sw, sh, 0, 0, c.width, c.height);
               return c;
             };

             const cleanup = () => {
               box.removeEventListener('pointerdown', onDown); box.removeEventListener('pointermove', onMove);
               box.removeEventListener('pointerup', onUp); box.removeEventListener('pointercancel', onUp);
               chips.removeEventListener('click', onChip); window.removeEventListener('resize', onResize);
               m.removeEventListener('click', onAction); document.removeEventListener('keydown', onKey);
               m.hidden = true; img.removeAttribute('src'); URL.revokeObjectURL(url);
               document.body.style.overflow = '';
             };
             const done = (result) => { cleanup(); resolve(result); };
             const onAction = (e) => {
               const act = e.target.closest('[data-act]'); if (!act) return;
               const a = act.dataset.act;
               if (a === 'ok') done({ canvas: makeCanvas(false) });
               else if (a === 'full') done({ canvas: makeCanvas(true) });
               else if (a === 'skip') done({ skipped: true });
               else done({ aborted: true });
             };
             const onKey = (e) => { if (e.key === 'Escape') done({ aborted: true }); };
             m.addEventListener('click', onAction);
             document.addEventListener('keydown', onKey);

             img.onerror = () => { cleanup(); alert("That file couldn't be read as an image. Please choose another photo."); resolve(bulk ? { skipped: true } : { aborted: true }); };
             img.onload = () => {
               nw = img.naturalWidth; nh = img.naturalHeight;
               measure(); fitBox(); render();
               const ok = m.querySelector('[data-act="ok"]'); if (ok) ok.focus({ preventScroll: true });
             };
             document.body.style.overflow = 'hidden';
             m.hidden = false;
             img.src = url;
           });
         }

         /* One image field = [URL box] + [file picker] + preview + status. Picking a file opens the crop window. */
         function setupImageField({ fileInput, urlInput, aspect, label, preview }) {
           const status = document.createElement('small');
           status.className = 'img-status';
           fileInput.insertAdjacentElement('afterend', status);
           let pv = preview;
           if (!pv) { pv = document.createElement('img'); pv.className = 'img-preview'; pv.alt = ''; status.insertAdjacentElement('afterend', pv); }
           const refresh = () => {
             const src = safeImageSrc(urlInput.value);
             if (src) { pv.src = src; pv.style.display = 'block'; } else { pv.removeAttribute('src'); pv.style.display = 'none'; }
           };
           urlInput.addEventListener('input', refresh);
           refresh();
           fileInput.addEventListener('change', async () => {
             const file = fileInput.files[0];
             fileInput.value = '';
             if (!file) return;
             const res = await openCropper(file, { aspect, title: 'Crop ' + label });
             if (res.canvas) await uploadIntoField(res.canvas, urlInput, status, refresh);
           });
           return status;
         }

         // Photos saved by older versions live INSIDE the card as text. Move them to Storage (original bytes, no quality loss).
         async function migrateInlineImages() {
           const inputs = [...document.querySelectorAll('.proj-img, .custom-card-img, #edit-avatar-url')]
             .filter(el => /^data:image\//i.test(el.value) && el.value.length > 30000);
           for (const el of inputs) {
             try {
               const blob = await (await fetch(el.value)).blob();
               el.value = await uploadImageBlob(blob);
               el.dispatchEvent(new Event('input', { bubbles: true }));
             } catch (err) {
               console.warn('Could not move a photo to cloud storage:', err);
               storageProblem = err; showStorageNotice();
               break;
             }
           }
         }

         const userSlug = (new URLSearchParams(window.location.search).get('user') || '').trim();
         const slugIsValid = /^[A-Za-z0-9._-]{1,64}$/.test(userSlug) && userSlug !== '.' && userSlug !== '..';
         const slugParam = encodeURIComponent(userSlug);

         const loader = $('loader');

         // so the Back button can't loop between pages.
         const goToProfile = () => window.location.replace(`index.html?user=${slugParam}`);

         // Errors are shown INSIDE the loader overlay, so a failure can never leave a silent black screen.
         function showLoadError() {
           loader.innerHTML = `

             </div>`;
           loader.style.display = 'flex';

         /* ---------------- section headings + delete / restore built-in sections ---------------- */
         const escHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
           ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

         // Same rule as the public card (index.html): the last word is shown in the theme colour.
         // The four built-in default headings keep their original look until the person renames them.
         const DEFAULT_HEADINGS = {
           work:    { text: 'My Projects',     html: 'My <span>Projects</span>' },
           service: { text: 'My Services',     html: '<span>My</span> Services' },
           skills:  { text: 'My Skills',       html: 'My <span>Skills</span>' },
           contact: { text: 'Connect With Me', html: 'Connect <span>With Me</span>' }
         };
         function headingHtml(key, raw) {
           const text = String(raw ?? '').trim().replace(/\s+/g, ' ');
           const def = key ? DEFAULT_HEADINGS[key] : null;
           if (def && (!text || text === def.text)) return def.html;
           if (!text) return '';
           const words = text.split(' ');
           return words.length > 1
             ? `${escHtml(words.slice(0, -1).join(' '))} <span>${escHtml(words[words.length - 1])}</span>`
             : `<span>${escHtml(text)}</span>`;
         }

         const headingPreviewUpdaters = [];
         function bindTitlePreview(input, preview, key) {
           const update = () => { preview.innerHTML = headingHtml(key, input.value); };
           input.addEventListener('input', update);

         // key = id stored in "hiddenSections". Deleting a section hides it on the card; nothing is

           skills:   { headingKey: 'skills',  block: 'sec-skills',   title: 'edit-skills-title',  preview: 'preview-skills-title',  container: 'edit-skills-container',   addBlank: () => addAdminSkillCategory() }

         function setSectionDeleted(key, deleted) {

         function deleteSection(key) {
           const cfg = BUILTIN_SECTIONS[key], container = $(cfg.container);
           cfg.stash = Array.from(container.children);   // kept in memory so "Add ... Back" can bring the cards back
           container.replaceChildren();

           const cfg = BUILTIN_SECTIONS[key], container = $(cfg.container);

         // 2. Projects (Limit: 10 Max)
         function addAdminProject(title = '', desc = '', imgUrl = '', link = '') {
           const container = $('edit-projects-container');
           if (container.querySelectorAll('.dynamic-row').length >= 10) {
             alert("Maximum 10 projects allowed.");

              <input type="text" class="edit-input proj-link" placeholder="Project Destination URL (Optional)">
           `;

         // Pick many photos at once: each one is cropped in turn and becomes its own project (max 10 projects in total).
         $('add-project-photos-btn').addEventListener('click', () => $('project-photos-input').click());
         $('project-photos-input').addEventListener('change', async () => {
           const input = $('project-photos-input');
           const files = [...input.files];
           input.value = '';
           if (!files.length) return;
           const room = 10 - $('edit-projects-container').querySelectorAll('.dynamic-row').length;
           if (room <= 0) { alert("Maximum 10 projects allowed."); return; }
           const use = files.slice(0, room);
           if (files.length > room) alert(`Only ${room} more project${room === 1 ? '' : 's'} fit (maximum 10). The first ${room} photo${room === 1 ? '' : 's'} will be used.`);
           for (let i = 0; i < use.length; i++) {
             const res = await openCropper(use[i], { aspect: 16 / 9, title: 'Crop project photo', step: `Photo ${i + 1} of ${use.length}`, bulk: true });
             if (res.aborted) break;
             if (res.skipped) continue;
             const row = addAdminProject();
             if (!row) break;
             // the upload runs in the background while the next photo is being cropped
             uploadIntoField(res.canvas, row.querySelector('.proj-img'), row._imgStatus, () => row.querySelector('.proj-img').dispatchEvent(new Event('input', { bubbles: true })));
           }
         });

         /* ---------------- load: owner-only with Default Fallbacks ---------------- */
         function populate(data) {
           setThemeHue(data.themeHue !== undefined && data.themeHue !== null && data.themeHue !== '' ? data.themeHue : DEFAULTS.themeHue);

           $('edit-hero-name').value = data.heroName !== undefined ? data.heroName : DEFAULTS.heroName;

           $('edit-hero-tag').value = tag;

           const avatar = safeImageSrc(data.profileImageUrl || data.avatar);
           if (avatar) {
             $('edit-avatar-url').value = avatar;
             $('avatar-preview').src = avatar;
             $('avatar-preview').style.display = 'block';
           }

          applyAvatarPreviewShape(data.avatarShape || 'window');

           const hiddenSections = new Set(Array.isArray(data.hiddenSections) ? data.hiddenSections : []);

           projects.slice(0, 10).forEach(p => addAdminProject(
             p.projectTitle !== undefined ? p.projectTitle : p.title,
             p.projectDescription !== undefined ? p.projectDescription : p.description,
             p.projectImageUrl || 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80',
             p.projectLink !== undefined ? p.projectLink : p.link
           ));

           const services = hiddenSections.has('services') ? [] : (Array.isArray(data.services) ? data.services : DEFAULTS.services);
           services.slice(0, 6).forEach(s => addAdminService(s.serviceName, s.serviceDescription, s.servicePerks));

           const skillCategories = hiddenSections.has('skills') ? [] : (Array.isArray(data.skillCategories) ? data.skillCategories : DEFAULTS.skillCategories);
           skillCategories.slice(0, 5).forEach(c => addAdminSkillCategory(c.categoryTitle, c.skills));

           // Section headings and deleted state of the built-in sections
           $('edit-work-title').value = data.workTitle !== undefined ? data.workTitle : DEFAULTS.workTitle;
           $('edit-service-title').value = data.serviceTitle !== undefined ? data.serviceTitle : DEFAULTS.serviceTitle;
           $('edit-skills-title').value = data.skillsTitle !== undefined ? data.skillsTitle : DEFAULTS.skillsTitle;
           $('edit-connect-title').value = data.connectTitle !== undefined ? data.connectTitle : DEFAULTS.connectTitle;
           Object.keys(BUILTIN_SECTIONS).forEach(k => setSectionDeleted(k, hiddenSections.has(k)));
           refreshHeadingPreviews();

           if (Array.isArray(data.customSections)) {
             data.customSections.slice(0, 3).forEach(sec => addAdminCustomSection(sec));
           }

           $('edit-phone').value = data.phoneNumber !== undefined ? data.phoneNumber : DEFAULTS.phoneNumber;
           if (data.phoneNumber2) addAdminPhone2(data.phoneNumber2);

           const links = Array.isArray(data.links) ? data.links : DEFAULTS.links;
           links.forEach(l => addAdminLink(l.label, l.url));
         }

         async function init() {
           if (!slugIsValid) { window.location.replace('index.html'); return; }

           try {
             await withTimeout(auth.authStateReady());
             const user = auth.currentUser;

             // Not signed in: this page is not for you. Show the public profile (never bounce to claim.html -> no loops).
             if (!user) { goToProfile(); return; }

             const snap = await withTimeout(getDoc(doc(db, "DigitalCard", userSlug)));

             // Unclaimed card: it can only be claimed with a click on claim.html, never from here.
             if (!snap.exists()) { goToProfile(); return; }

             const data = snap.data();
             if (data.ownerUid !== user.uid) {
               alert("Unauthorized. You do not own this card.");
               goToProfile();
               return;
             }

             populate(data);
             const modalEl = document.querySelector('.edit-modal-content');
             const showFloatingSave = () => $('edit-save-btn').classList.add('floating-save');
             modalEl.addEventListener('input', showFloatingSave);
             modalEl.addEventListener('change', showFloatingSave);
             modalEl.addEventListener('click', (e) => {
               if (e.target.closest('.theme-circle, .add-btn, .sub-add-btn, .remove-btn, .nested-remove-btn, .sec-restore-btn')) {
                 showFloatingSave();
               }
             });
             loader.style.display = 'none';
           } catch (err) {
             console.error("Load Error:", err);
             showLoadError();
           }
         }

         /* ---------------- sign out / cancel ---------------- */
         $('edit-close-btn').addEventListener('click', goToProfile);

         $('edit-logout-btn').addEventListener('click', async () => {
           try { await signOut(auth); } catch (err) { console.error("Sign-out error:", err); }
           goToProfile();
         });

         /* ---------------- save ---------------- */
         let saving = false, migrating = false;
         $('edit-save-btn').addEventListener('click', async () => {
           if (saving || migrating) return;
           const btn = $('edit-save-btn');
           const idleLabel = btn.innerText;

           if (!auth.currentUser) { goToProfile(); return; }

           if (pendingUploads > 0) {
             alert("Your photos are still uploading. Please wait a few seconds, then press Save again.");
             return;
           }
           migrating = true; btn.innerText = "Preparing photos...";
           try { await migrateInlineImages(); } finally { migrating = false; btn.innerText = idleLabel; }

           const rawPhone = $('edit-phone').value.trim();
           if (!rawPhone) {
             alert("Mobile number is compulsory. Please enter a mobile number.");
             $('edit-phone').focus();
             return;
           }

           const parsedHue = parseInt($('edit-theme-hue').value, 10);
           const themeHue = Number.isNaN(parsedHue) ? DEFAULTS.themeHue : parsedHue;

           const heroName = $('edit-hero-name').value.trim() || DEFAULTS.heroName;
           const heroRoles = [];
           document.querySelectorAll('#edit-roles-container .role-item').forEach(inp => {
             const val = inp.value.trim();
             if (val) heroRoles.push(val);
           });

           const heroTag = $('edit-hero-tag').value.trim();
           const rawAvatar = $('edit-avatar-url').value.trim();
           const profileImageUrl = safeImageSrc(rawAvatar);
           const avatarShape = AVATAR_SHAPES.includes($('edit-avatar-shape').value) ? $('edit-avatar-shape').value : 'window';
           const aboutTitle = $('edit-about-title').value.trim();

           // Section headings (empty = back to the default) and which built-in sections were deleted.
           const workTitle = $('edit-work-title').value.trim().replace(/\s+/g, ' ') || DEFAULTS.workTitle;
           const serviceTitle = $('edit-service-title').value.trim().replace(/\s+/g, ' ') || DEFAULTS.serviceTitle;
           const skillsTitle = $('edit-skills-title').value.trim().replace(/\s+/g, ' ') || DEFAULTS.skillsTitle;
           const connectTitle = $('edit-connect-title').value.trim().replace(/\s+/g, ' ') || DEFAULTS.connectTitle;
           const hiddenSections = Object.keys(BUILTIN_SECTIONS).filter(k => $(BUILTIN_SECTIONS[k].block).dataset.deleted === '1');

           // Every field that is not valid is collected here, marked red, and reported before anything is saved.
           const problems = [];
           const flag = (el, label, kind) => problems.push({ el, label, kind });
           if (rawAvatar && !profileImageUrl) flag($('edit-avatar-url'), 'Profile picture link', 'link');

           const projects = [];
           document.querySelectorAll('#edit-projects-container .dynamic-row').forEach((row, i) => {
             const projectTitle = row.querySelector('.proj-title').value.trim();
             const projectDescription = row.querySelector('.proj-desc').value.trim();
             const rawImg = row.querySelector('.proj-img').value.trim();
             const rawLink = row.querySelector('.proj-link').value.trim();
             if (!projectTitle) return;
             const projectImageUrl = safeImageSrc(rawImg);
             if (rawImg && !projectImageUrl) flag(row.querySelector('.proj-img'), `Project ${i + 1} thumbnail link`, 'link');
             const projectLink = normalizeUrl(rawLink, ['http:', 'https:']);
             if (rawLink && !projectLink) flag(row.querySelector('.proj-link'), `Project ${i + 1} destination link`, 'link');
             projects.push({
               projectTitle,
               projectDescription,
               projectImageUrl,
               projectLink,
               title: projectTitle,
               description: projectDescription,
               link: projectLink
             });
           });

           const services = [];
           document.querySelectorAll('#edit-services-container .dynamic-row').forEach(row => {
             const serviceName = row.querySelector('.srv-name').value.trim();
             const serviceDescription = row.querySelector('.srv-desc').value.trim();
             if (!serviceName) return;
             const servicePerks = [];
             row.querySelectorAll('.srv-perk').forEach(p => {
               const val = p.value.trim();
               if (val) servicePerks.push(val);
             });
             services.push({ serviceName, serviceDescription, servicePerks: servicePerks.slice(0, 5) });
           });

           const skillCategories = [];
           document.querySelectorAll('#edit-skills-container .dynamic-row').forEach(row => {
             const categoryTitle = row.querySelector('.skill-cat-title').value.trim();
             if (!categoryTitle) return;
             const skills = [];
             row.querySelectorAll('.skill-item-input').forEach(s => {
               const val = s.value.trim();
               if (val) skills.push(val);
             });
             skillCategories.push({ categoryTitle, skills });
           });

           const customSections = [];
           document.querySelectorAll('#edit-custom-sections-container .custom-section-row').forEach(secRow => {
             const sectionTitle = secRow.querySelector('.custom-sec-title').value.trim();
             const sectionSubtitle = secRow.querySelector('.custom-sec-subtitle').value.trim();
             const layoutType = secRow.querySelector('.custom-sec-type').value;
             if (!sectionTitle) return;

             const cards = [];
             secRow.querySelectorAll('.custom-card-box').forEach(cardEl => {
               const title = cardEl.querySelector('.custom-card-title').value.trim();
               const description = cardEl.querySelector('.custom-card-desc').value.trim();
               const rawImg = cardEl.querySelector('.custom-card-img').value.trim();
               const rawLink = cardEl.querySelector('.custom-card-link').value.trim();
               if (!title) return;

               let imageUrl = '';
               let link = '';
               if (layoutType === 'work') {
                 imageUrl = safeImageSrc(rawImg);
                 if (rawImg && !imageUrl) flag(cardEl.querySelector('.custom-card-img'), `"${sectionTitle}" > "${title}" image link`, 'link');
                 link = normalizeUrl(rawLink, ['http:', 'https:']);
                 if (rawLink && !link) flag(cardEl.querySelector('.custom-card-link'), `"${sectionTitle}" > "${title}" link`, 'link');
               }

               const items = [];
               if (layoutType === 'skills' || layoutType === 'services') {
                 cardEl.querySelectorAll('.custom-card-item').forEach(it => {
                   const val = it.value.trim();
                   if (val) items.push(val);
                 });
               }

               cards.push({
                 title,
                 description,
                 imageUrl,
                 link,
                 items: layoutType === 'services' ? items.slice(0, 5) : items
               });
             });

             customSections.push({
               sectionTitle,
               sectionSubtitle,
               layoutType,
               cards: cards.slice(0, 6)
             });
           });

           // Mobile numbers: 10 digits, or +country code (e.g. +91 98765 43210). Only the format is checked.
           const phoneNumber = normalizePhone(rawPhone);
           if (!phoneNumber) flag($('edit-phone'), 'Mobile number', 'phone');

           let phoneNumber2 = '';
           const phone2El = document.querySelector('#edit-phone2-container .phone2-input');
           if (phone2El && phone2El.value.trim()) {
             phoneNumber2 = normalizePhone(phone2El.value);
             if (!phoneNumber2) flag(phone2El, 'Second mobile number', 'phone');
             else if (phoneNumber2 === phoneNumber) phoneNumber2 = '';   // same number twice: keep one
           }

           const links = [];
           document.querySelectorAll('#edit-links-container .dynamic-row').forEach((row, i) => {
             const labelEl = row.querySelector('.link-label'), urlEl = row.querySelector('.link-url');
             const label = labelEl.value.trim();
             const rawUrl = urlEl.value.trim();
             if (!label && !rawUrl) return;                                  // empty row: ignored
             if (!label) { flag(labelEl, `Redirect button ${i + 1} name`, 'missing'); return; }
             if (!rawUrl) { flag(urlEl, `"${label}" button link`, 'missing'); return; }
             const url = normalizeUrl(rawUrl);
             if (!url) { flag(urlEl, `"${label}" button link`, 'link'); return; }
             links.push({ label, url });
           });

           if (problems.length) {
             problems.forEach(p => { p.el.style.borderColor = '#ff4d4d'; });
             const first = problems[0];
             const typed = String(first.el.value || '').slice(0, 60);
             let msg;
             if (first.kind === 'phone') msg = `Please enter a valid number for: ${first.label}\n\nUse 10 digits (98765 43210) or add the country code (+91 98765 43210).\nYou entered: "${typed}"`;
             else if (first.kind === 'missing') msg = `${first.label} is incomplete.\n\nFill in both the name and a valid link, or remove that row.`;
             else msg = `Please enter a valid link for: ${first.label}\n\nExample: https://example.com/yourpage\nYou entered: "${typed}"`;
             if (problems.length > 1) msg += `\n\n${problems.length - 1} more field(s) are marked in red.`;
             alert(msg);
             first.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
             first.el.focus({ preventScroll: true });
             return;
           }

           // ownerUid and name are never sent: ownership can't be changed from this form.
           const payload = {
             themeHue,
             heroName,
             heroRoles,
             heroTag,
             description: heroTag,
             profileImageUrl,
             avatar: profileImageUrl,
             avatarShape,
             aboutTitle,
             workTitle,
             serviceTitle,
             skillsTitle,
             connectTitle,
             hiddenSections,
             projects: projects.slice(0, 10),
             services: services.slice(0, 6),
             skillCategories: skillCategories.slice(0, 5),
             customSections: customSections.slice(0, 3),
             phoneNumber,
             phoneNumber2,
             links
           };

           const payloadChars = JSON.stringify(payload).length;
           if (payloadChars > 900000) {
             alert(`Your card is too big to save (${Math.round(payloadChars / 1024)} KB, the limit is about 880 KB).\n\n` +
               (storageProblem
                 ? "Photos can't go to cloud storage yet, so they are being stored inside the card. Enable Firebase Storage (see the notice at the top of this page) or remove a few photos."
                 : "Remove a few photos or text and try again."));
             return;
           }

           saving = true;
           btn.innerText = "Saving...";

           try {
             await withTimeout(updateDoc(doc(db, "DigitalCard", userSlug), payload), 20000);
             btn.innerText = "Success!";
             btn.style.background = "#00ff00";
             btn.style.color = "#000";
             // Keep the page fully visible until the redirect happens (nothing is torn down here).
             setTimeout(goToProfile, 800);
           } catch (error) {
             console.error("Save Error:", error);
             btn.innerText = "Error Saving";
             // Let the person retry instead of leaving a dead button.
             setTimeout(() => { btn.innerText = idleLabel; saving = false; }, 2500);
           }
         });

         // Coming back via the browser's Back button must re-check the real state instead of showing a stale form.
         window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });

         init();
      </script>
   </body>
</html>
