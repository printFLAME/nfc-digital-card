<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Claim Card | FLAME</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">
      <style>
/*=============== YOUR EXACT CSS (100% UNTOUCHED) ===============*/
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Syne:wght@400..800&display=swap");
:root { --header-height: 3.5rem; --hue: 110; --first-color: hsl(var(--hue), 75%, 60%); --white-color: hsl(var(--hue), 24%, 98%); --black-color: hsl(var(--hue), 12%, 8%); --text-color: hsl(var(--hue), 4%, 70%); --body-color: hsl(var(--hue), 12%, 4%); --container-color: hsl(var(--hue), 8%, 10%); --body-font: "Poppins", sans-serif; --second-font: "Syne", sans-serif; --biggest-font-size: 2rem; --bigger-font-size: 1.75rem; --h1-font-size: 1.5rem; --h2-font-size: 1.25rem; --h3-font-size: 1rem; --normal-font-size: .938rem; --small-font-size: .813rem; --font-regular: 400; --font-medium: 500; --font-semi-bold: 600; --z-tooltip: 10; --z-fixed: 100; }
@media (width >= 1150px) { :root { --biggest-font-size: 5rem; --bigger-font-size: 3rem; --h1-font-size: 2.25rem; --h2-font-size: 1.5rem; --h3-font-size: 1.25rem; --normal-font-size: 1rem; } }
* { box-sizing: border-box; padding: 0; margin: 0; }
html { scroll-behavior: smooth; }
body, input, button, textarea, label { font-family: var(--body-font); font-size: var(--normal-font-size); }
body { background-color: var(--body-color); color: var(--text-color); }
input, button, textarea { border: none; outline: none; background: none; }
h1, h2, h3, h4 { color: var(--white-color); font-weight: var(--font-semi-bold); font-family: var(--second-font); }
.button { display: inline-flex; align-items: center; justify-content: center; column-gap: .5rem; background-color: var(--first-color); color: var(--black-color); padding: 1rem 2rem; border-radius: 4rem; font-weight: var(--font-semi-bold); transition: box-shadow 0.4s; cursor: pointer; }
.button:hover { box-shadow: 0 8px 24px hsla(var(--hue), 75%, 60%, 0.3); }

#loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--body-color); display: flex; justify-content: center; align-items: center; z-index: 9999; }
.spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--first-color); animation: spin 1s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.setup-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--body-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; text-align: center; padding: 2rem; color: var(--text-color); }
.setup-screen h1 { font-size: var(--biggest-font-size); margin: 1rem 0; color: var(--white-color); }
      </style>
   </head>
   <body>
      <div id="loader" style="display: none;"><div class="spinner"></div></div>

      <div id="setup-screen" class="setup-screen">
         <i class="ri-nfc-line" style="font-size: 4rem; color: var(--first-color);"></i>
         <h1>Claim Your Card</h1>
         <p style="margin-bottom: 2rem;">This NFC card is unregistered. Log in to claim this link and build your custom profile.</p>
         <button class="button" id="setup-login-btn"><i class="ri-google-fill"></i> Sign in with Google</button>
      </div>

      <script type="module">
         import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
         import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
         import { getFirestore, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
       
         const firebaseConfig = {
           apiKey: "AIzaSyA043mcgewwke4Rt2HusOPbcxgmzUv2bM0",
           authDomain: "nfc-card-by-flame.firebaseapp.com",
           projectId: "nfc-card-by-flame",
           storageBucket: "nfc-card-by-flame.firebasestorage.app",
           messagingSenderId: "185781519047",
           appId: "1:185781519047:web:dcf141d9669a3055e274e2"
         };
       
         const app = initializeApp(firebaseConfig);
         const auth = getAuth(app);
         const provider = new GoogleAuthProvider();
         const db = getFirestore(app);

         const urlParams = new URLSearchParams(window.location.search);
         let userSlug = urlParams.get('user');
         
         if (userSlug) {
             sessionStorage.setItem('savedUserSlug', userSlug);
         } else {
             userSlug = sessionStorage.getItem('savedUserSlug');
         }

         if (!userSlug) {
             document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:50px;'>Error: Missing ?user= ID in the link!</h1>";
             throw new Error("No ID");
         }

         // THE FIX: Track login state, but DO NOT automatically claim the card!
         let activeUser = null;
         onAuthStateChanged(auth, (user) => {
             activeUser = user;
         });

         // THE FIX: Only claim the card when the human specifically clicks this button
         document.getElementById('setup-login-btn').addEventListener('click', async () => {
             const loader = document.getElementById('loader');
             loader.style.display = 'flex';
             try {
                 let user = activeUser;
                 
                 // If not logged in in the background, pop open the Google Login
                 if (!user) {
                     const result = await signInWithPopup(auth, provider);
                     user = result.user;
                 }
                 
                 const q = query(collection(db, "DigitalCard"), where("name", "==", userSlug));
                 const snap = await getDocs(q);
                 
                 // Create the database slot
                 if (snap.empty) {
                     await addDoc(collection(db, "DigitalCard"), { name: userSlug, ownerUid: user.uid });
                 }
                 
                 // Send them to their live profile
                 window.location.href = `index.html?user=${userSlug}`;
             } catch (error) {
                 console.error("Auth Error:", error);
                 loader.style.display = 'none';
                 alert("Login failed or popup was blocked.");
             }
         });
      </script>
   </body>
</html>
